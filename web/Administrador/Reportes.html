<!DOCTYPE html>
<html>
    <head>
        <title>Reportes</title>
        <meta charset="UTF-8">
        <meta name="viewport"
              content="width=device-width, initial-scale=1.0">

        <link rel="stylesheet"
              href="../css/estilos.css">
    </head>

    <body>

        <div class="dashboard">

            <div class="panel-menu">

                <h1>Reportes</h1>

                <p>
                    Generación de reportes administrativos de consultas médicas.
                </p>

                <form action="../Control"
                      method="post"
                      class="form-reporte">

                    <label>Periodo:</label>

                    <select name="periodo">
                        <option value="MES">Último mes</option>
                        <option value="SEMESTRE">Últimos 6 meses</option>
                        <option value="ANIO">Último año</option>
                    </select>

                    <label>Tipo de reporte:</label>

                    <select name="accion">
                        <option value="pdfBarrasConsultas">PDF Barras</option>
                        <option value="pdfPieConsultas">PDF Pie</option>
                        <option value="excelConsultas">Excel</option>
                        <option value="xmlConsultas">XML</option>
                    </select>

                    <input type="submit"
                           value="Generar Reporte">

                </form>

                <br>

                <a class="cerrar"
                   href="MenuAdmin.html">
                    Volver
                </a>

            </div>

        </div>

    </body>
</html>
